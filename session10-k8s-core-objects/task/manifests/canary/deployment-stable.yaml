apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  namespace: s10-lab
  labels:
    app: myapp-canary
    track: stable
    version: v1
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-canary
      track: stable
  template:
    metadata:
      labels:
        app: myapp-canary        # shared label -> selected by the single Service
        track: stable                # discriminator -> lets each Deployment own its pods
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.24-alpine
          ports:
            - containerPort: 80
          command:
            - /bin/sh
            - -c
            - >
              echo '<html><body style="background:#1a1a2e;color:#e2e2e2;font-family:monospace;font-size:3em;text-align:center;padding-top:20vh"><p>STABLE v1</p><p style="font-size:0.4em">Track: stable</p></body></html>'
              > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          resources:
            requests: { cpu: "10m", memory: "24Mi" }
            limits:   { cpu: "80m", memory: "64Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
