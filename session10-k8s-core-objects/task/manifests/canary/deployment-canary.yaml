apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  namespace: s10-lab
  labels:
    app: myapp-canary
    track: canary
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-canary
      track: canary
  template:
    metadata:
      labels:
        app: myapp-canary        # shared label -> selected by the single Service
        track: canary                # discriminator -> lets each Deployment own its pods
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          command:
            - /bin/sh
            - -c
            - >
              echo '<html><body style="background:#7b2d00;color:#ffd60a;font-family:monospace;font-size:3em;text-align:center;padding-top:20vh"><p>CANARY v2</p><p style="font-size:0.4em">Track: canary</p></body></html>'
              > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          resources:
            requests: { cpu: "10m", memory: "24Mi" }
            limits:   { cpu: "80m", memory: "64Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
