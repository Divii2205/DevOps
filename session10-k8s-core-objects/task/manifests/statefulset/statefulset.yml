# Headless Service is MANDATORY for a StatefulSet: it gives each pod a stable
# DNS name  mysql-<ordinal>.mysql.s10-lab.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: s10-lab
  labels:
    app: mysql
spec:
  clusterIP: None          # headless
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: s10-lab
spec:
  serviceName: "mysql"
  replicas: 2              # reduced from 3 to fit the RAM budget of this lab cluster
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: mysql
          image: mysql:5.7
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "password"
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
