apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  namespace: s10-lab
  labels:
    app: app-rolling
spec:
  replicas: 3
  # RollingUpdate replaces old pods gradually while keeping the Service up.
  #   maxSurge: 1        -> at most 3 + 1 = 4 pods may exist during the rollout
  #   maxUnavailable: 0  -> never fewer than 3 - 0 = 3 Ready pods  => zero downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          # Write the version page BEFORE nginx starts, so the readiness probe can
          # never observe the stock nginx welcome page (deterministic, unlike postStart).
          command:
            - /bin/sh
            - -c
            - >
              echo '<html><body style="background:#0f3460;color:#e94560;font-family:monospace;font-size:3em;text-align:center;padding-top:20vh"><p>VERSION: v2</p><p style="font-size:0.5em">Rolling Update Demo - NEW VERSION!</p></body></html>'
              > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          resources:
            requests: { cpu: "30m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
