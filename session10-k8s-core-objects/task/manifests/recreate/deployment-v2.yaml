apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
  namespace: s10-lab
  labels:
    app: app-recreate
spec:
  replicas: 3
  # Recreate: the controller scales the OLD ReplicaSet to 0 and WAITS for every
  # old pod to disappear before it creates a single new pod. No two versions ever
  # run at once -- and there is a guaranteed outage window with zero endpoints.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-recreate
  template:
    metadata:
      labels:
        app: app-recreate
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          command:
            - /bin/sh
            - -c
            - >
              echo '<html><body style="background:#0f4c81;color:#00ffcc;font-family:monospace;font-size:2.5em;text-align:center;padding-top:20vh"><p>STRATEGY: RECREATE</p><p>VERSION: v2 (UPGRADED)</p><p style="font-size:0.4em">Successfully replaced after full shutdown</p></body></html>'
              > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          resources:
            requests: { cpu: "30m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
