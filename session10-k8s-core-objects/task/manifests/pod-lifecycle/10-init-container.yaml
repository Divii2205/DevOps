apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  namespace: s10-lab
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Init container running'; sleep 10; echo 'Init complete'"]
  containers:
    - name: app
      image: nginx:1.27
      resources:
        requests: { cpu: "20m", memory: "32Mi" }
        limits:   { cpu: "100m", memory: "96Mi" }
