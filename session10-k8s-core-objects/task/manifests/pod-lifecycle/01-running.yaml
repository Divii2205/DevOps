apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-running
  namespace: s10-lab
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests: { cpu: "20m", memory: "32Mi" }
        limits:   { cpu: "100m", memory: "96Mi" }
