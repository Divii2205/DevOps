# Baseline WORKING deployment. Deployed first so that the broken rollout in
# broken-image.yaml has healthy "old" pods to stall against.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  namespace: s10-lab
  labels:
    app: yatri-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
        version: "v2"
    spec:
      containers:
        - name: backend
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
