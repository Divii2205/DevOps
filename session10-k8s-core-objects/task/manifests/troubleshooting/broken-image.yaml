# ==============================================================================
# INTENTIONALLY BROKEN MANIFEST - ROLLOUT FAILURE & ROLLBACK DRILL
# The tag 'non-existent-tag-v999' does not exist on Docker Hub, so every NEW
# surge pod lands in ImagePullBackOff. Because maxUnavailable is 0 the three
# OLD pods are never torn down -> the rollout stalls but the service stays up.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  namespace: s10-lab
  labels:
    app: yatri-backend
    version: "broken-v3"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
        version: "broken-v3"
    spec:
      containers:
        - name: backend
          image: yatri-backend:non-existent-tag-v999
          ports:
            - containerPort: 5000
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
