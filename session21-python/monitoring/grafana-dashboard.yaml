# Grafana (kube-prometheus-stack) loads every ConfigMap with label grafana_dashboard=1
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  taskboard.json: |
    {
      "title": "TaskBoard API",
      "uid": "taskboard",
      "time": {"from": "now-30m", "to": "now"},
      "refresh": "10s",
      "panels": [
        {"type": "timeseries", "title": "HTTP requests per second (by handler)",
         "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "sum by (handler) (rate(http_requests_total{handler!=\"/metrics\"}[1m]))", "legendFormat": "{{handler}}"}]},
        {"type": "timeseries", "title": "Latency p95 (seconds)",
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m])))", "legendFormat": "p95"}]},
        {"type": "stat", "title": "Error rate (5xx %)",
         "gridPos": {"x": 0, "y": 8, "w": 6, "h": 6},
         "targets": [{"expr": "(100 * sum(rate(http_requests_total{status=\"5xx\"}[5m])) / sum(rate(http_requests_total[5m]))) or vector(0)"}]},
        {"type": "stat", "title": "Backend pods UP",
         "gridPos": {"x": 6, "y": 8, "w": 6, "h": 6},
         "targets": [{"expr": "sum(up{service=\"backend\"})"}]},
        {"type": "timeseries", "title": "Backend CPU (cores)",
         "gridPos": {"x": 12, "y": 8, "w": 12, "h": 6},
         "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"taskboard\", container=\"backend\"}[1m]))", "legendFormat": "{{pod}}"}]}
      ]
    }
