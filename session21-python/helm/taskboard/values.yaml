frontend:
  image: ghcr.io/divii2205/taskboard-frontend
  tag: latest   # CI / GitOps sets the Git commit SHA
backend:
  image: ghcr.io/divii2205/taskboard-backend
  tag: latest   # CI / GitOps sets the Git commit SHA
replicaCount: 2
config:
  appName: TaskBoard API
  environment: dev
namespace: taskboard
imagePullSecrets: []
postgres:
  host: taskboard-postgres
  database: taskboard
  username: taskboard
  password: taskboard
ingress:
  enabled: false
  host: taskboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
