# Local Kubernetes cluster (free stand-in for EKS). Port 80/443 go to the ingress-nginx controller.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: session21
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 80, protocol: TCP}
      - {containerPort: 443, hostPort: 443, protocol: TCP}
