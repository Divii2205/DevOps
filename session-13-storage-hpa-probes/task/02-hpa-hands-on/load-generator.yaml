# Load generator for the HPA demo (04-hpa).
# It is the YAML version of the "kubectl run load-generator ..." command in 04-hpa/readme1.md.
# It calls hpa-demo-service again and again with no pause, so the nginx Pods use more CPU.
# Stop the load with: kubectl delete -f task/02-hpa-hands-on/load-generator.yaml
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"
